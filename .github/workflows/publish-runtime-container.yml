name: Publish Lumrik runtime container

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TARGET: x86_64-unknown-linux-musl

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install musl build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            musl musl-dev musl-tools clang libc6-dev zlib1g-dev libbz2-dev

      - name: Install Rust target
        run: rustup target add "$TARGET"

      - name: Build all Lumrik binaries
        run: |
          cargo build \
            --locked \
            --release \
            --workspace \
            --bins \
            --target "$TARGET"

      - name: Collect and check runtime binaries
        run: |
          set -euo pipefail

          release_dir="target/$TARGET/release"
          runtime_dir="containers/lumrik-star/runtime-bin"

          rm -rf "$runtime_dir"
          mkdir -p "$runtime_dir"

          count=0

          while IFS= read -r exe; do
            name="$(basename "$exe")"

            echo "Collecting $name"
            file "$exe"

            cp "$exe" "$runtime_dir/$name"
            count=$((count + 1))
          done < <(
            find "$release_dir" \
              -maxdepth 1 \
              -type f \
              -executable \
              -print | sort
          )

          test "$count" -gt 0

          echo
          echo "Collected $count Lumrik binaries:"
          ls -lh "$runtime_dir"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/lumrik-star/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}