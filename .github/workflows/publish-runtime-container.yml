name: Publish Lumrik runtime container

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  TARGET: x86_64-unknown-linux-musl

jobs:
  build-and-publish:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install musl build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            musl musl-dev musl-tools clang libc6-dev zlib1g-dev libbz2-dev

      - name: Install Rust target
        run: rustup target add "$TARGET"

      - name: Build Lumrik runtime binaries
        run: |
          cargo build --locked --release --target "$TARGET" \
            --bin nelrune \
            --bin nelrune-vdj \
            --bin nelrune-te \
            --bin vdj-index \
            --bin gtf-splice-index \
            --bin lumrik-guides

      - name: Check runtime binaries
        run: |
          for exe in nelrune nelrune-vdj vdj-index gtf-splice-index lumrik-guides; do
            test -x "target/$TARGET/release/$exe"
            file "target/$TARGET/release/$exe"
          done

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/lumrik-star/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
