[package]
name = "sc_primer"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
authors = ["Stefan Lang"]
description = "Reusable single-cell primer/read-structure grammar and detector for 10x, BD Rhapsody, ONT and Illumina preprocessing."
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/stela2502/sc_primer"
homepage = "https://github.com/stela2502/sc_primer"
documentation = "https://docs.rs/sc_primer"
keywords = ["single-cell", "primer", "fastq", "rhapsody", "10x"]
categories = ["science", "parser-implementations"]
exclude = ["target/", ".github/", "*.tmp"]

[dependencies]
clap = { version = "4.5.56", features = ["derive"] }
flate2 = "1"
int_to_str = { package = "stela-int-to-str", version = "0.2.3" }
#onehot_dna = { git = "https://github.com/stela2502/onehot_dna" }
onehot_dna = { package = "onehot_dna", version = "0.1.0"  }
read-tag-table = "0.1.0"

[dev-dependencies]
pretty_assertions = "1.4"
