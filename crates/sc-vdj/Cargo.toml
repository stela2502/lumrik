[package]
name = "sc-vdj"
version.workspace = true
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Clean single-cell V(D)J reconstruction for Lumrik/Nelrune"

[dependencies]
anyhow = "1"
clap = { workspace = true }
flate2 = "1"
fast_tag_mapper = { path = "../fast_tag_mapper" }
gtf_splice_index = { path = "../gtf_splice_index" }
mapping_info = { path = "../mapping_info" }
lumrik-status = { path = "../lumrik-status" }
rayon = "1"
rust-htslib = { path = "../rust-htslib" }
scdata = { path = "../scdata" }
sc_primer = { path = "../sc_primer" }
int-to-str = { path = "../int_to_str" }

[dev-dependencies]
tempfile = "3"
