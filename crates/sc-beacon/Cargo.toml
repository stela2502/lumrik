[package]
name = "sc-beacon"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
description = "Identifies genuine cellular feature signals relative to experimentally measured ambient background"
repository = "https://github.com/stela2502/lumrik"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
mapping_info = "0.1.0"
scdata = "0.2.3"
stela-int-to-str = "0.2.3"
statrs = "0.18"
rayon = "1.12.0"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "lumrik-guides"
path = "src/main.rs"
