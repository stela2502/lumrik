[package]
name = "bam_tide"
version = "1.3.2"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
bigtools = "0.5.6"
clap = { version = "4.5.56", features = ["derive"] }
rayon = "1.11.0"
tempfile = "3.24.0"
tokio = "1.49.0"


assert_cmd = "2.1.2"
rand = { version = "0.8", features = ["small_rng"] }
flate2 = "1.1.9"
csv = "1.4.0"
#snp-index = "0.1.0"

bincode = "1"
serde = { version = "1", features = ["derive"] }

rust-htslib.workspace = true
hts-sys =  { git = "https://github.com/stela2502/hts-sys.git" }


fast_tag_mapper = { path = "../fast_tag_mapper" }
gtf_splice_index = { path = "../gtf_splice_index" }
mapping_info = { path = "../mapping_info" }
read-tag-table = { path = "../read-tag-table" }
sc_primer = { path = "../sc_primer" }
scdata = { path = "../scdata" }
snp-index = { path = "../snp-index" }
int-to-str = { path = "../int_to_str" }
sc-beacon = { path = "../sc-beacon" }

[features]
manual-tests = []
manual-snp-tests = ["manual-tests"]
