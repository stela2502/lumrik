[package]
name = "traconmech"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Trace biological context to candidate mechanisms"

[dependencies]
anyhow = "1"
ai_llm_con = { path = "../ai_llm_con" }
clap = { workspace = true }
ommverse = { path = "../ommverse" }
sc-analysis = { path = "../sc-analysis" }
sc_anndata = { path = "../sc_anndata" }
hmm = { path = "../hmm" }
rayon = "1"
statrs = "0.18"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
flate2 = "1"
hdf5 = "0.8"
plotters = { version = "0.3", default-features = false, features = ["svg_backend", "line_series", "point_series"] }

[dev-dependencies]
ndarray = "0.15"
